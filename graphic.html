<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRC Team 2551 — The Penguins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #050d14;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }

  .canvas {
    width: 1200px;
    height: 680px;
    position: relative;
    overflow: hidden;

    background-color: #040d18;
    background-image:
      linear-gradient(rgba(80,160,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,160,255,0.04) 1px, transparent 1px),
      radial-gradient(ellipse 60% 75% at 41% 48%, #0e2a45 0%, #071525 55%, #040d18 100%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
  }

  /* ─── Identity block ─────────────────────────────────────────── */
  /* fixed to left:340px so logo never shifts; logo right edge ~640px */
  .identity {
    position: absolute;
    top: 50%;
    left: 340px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
  }

  .logo {
    height: 300px;
    width: auto;
    display: block;
    filter:
      drop-shadow(0 0 36px rgba(80, 160, 255, 0.6))
      drop-shadow(0 0 10px rgba(80, 160, 255, 0.35));
  }

  .team-number {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 76px;
    color: #e8f0ff;
    letter-spacing: -2px;
    margin-top: 10px;
    line-height: 1;
    text-shadow: 0 0 40px rgba(80, 160, 255, 0.4);
  }

  .subtitle {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 11px;
    color: rgba(140, 180, 230, 0.6);
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-top: 10px;
  }

  .divider {
    width: 100px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(80,160,255,0.45), transparent);
    margin-top: 20px;
  }

  /* ─── Terminal ───────────────────────────────────────────────── */
  /* sits in the lower-right corner, z-index below the logo */
  .terminal-wrap {
    position: absolute;
    bottom: 44px;
    right: 44px;
    width: 560px;
    z-index: 0;
  }

  .terminal {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(80,160,255,0.13),
      0 28px 64px rgba(0,0,0,0.7),
      0 0 48px rgba(30,100,200,0.07) inset;
  }

  .titlebar {
    background: #141c28;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    position: relative;
    border-bottom: 1px solid rgba(80,160,255,0.07);
  }

  .dots {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    z-index: 1;
  }

  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red    { background: #ff5f57; }
  .dot-yellow { background: #febc2e; }
  .dot-green  { background: #28c840; }

  .filename {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(150, 170, 200, 0.55);
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }

  .code-body {
    background: #0e1825;
    padding: 24px 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    line-height: 1.8;
  }

  .kw  { color: #7aa2d4; }
  .fn  { color: #4ec9b0; }
  .id  { color: #9cdcfe; }
  .pu  { color: rgba(220,230,255,0.7); }
  .neg { color: #d19a66; }
  .cmt { color: rgba(140,160,190,0.5); font-style: italic; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
  .cursor {
    animation: blink 1.1s ease-in-out infinite;
    color: rgba(80, 160, 255, 0.8);
  }

  /* ─── Watermark ──────────────────────────────────────────────── */
  .watermark {
    position: absolute;
    bottom: 20px;
    right: 24px;
    font-size: 10px;
    color: rgba(80, 120, 180, 0.28);
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 2px;
    z-index: 3;
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Terminal: absolutely pinned to lower-right -->
  <div class="terminal-wrap">
    <div class="terminal">
      <div class="titlebar">
        <div class="dots">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <span class="filename">TeleopPeriodic.java</span>
      </div>
      <div class="code-body"><pre style="white-space:pre;"><span class="kw">public</span> <span class="kw">void</span> <span class="fn">teleopPeriodic</span><span class="pu">() {</span>
    <span class="id">drivetrain</span><span class="pu">.</span><span class="fn">arcadeDrive</span><span class="pu">(</span>
        <span class="neg">-</span><span class="id">driver</span><span class="pu">.</span><span class="fn">getLeftY</span><span class="pu">(),</span>
        <span class="id">driver</span><span class="pu">.</span><span class="fn">getRightX</span><span class="pu">()</span>
    <span class="pu">);</span>
<span class="pu">}</span>
<span class="cmt">// your hands. the robot. live.<span class="cursor">▌</span></span></pre></div>
    </div>
  </div>

  <!-- Identity: logo + number + label, shifted left of center — rendered last so it's always in front -->
  <div class="identity">
    <img class="logo" src="site/assets/img/logo-2551.png" alt="Team 2551">
    <div class="team-number">2551</div>
    <div class="subtitle">FRC Robotics &nbsp;·&nbsp; The Penguins</div>
    <div class="divider"></div>
  </div>

  <div class="watermark">◆ 2551</div>

</div>
</body>
</html>
